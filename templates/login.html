
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - NewsIntel</title>

  <link rel="icon" href="{{ url_for('static', filename='sheild.png') }}?v=2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }
    .card-login {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 35px #0f172a12;
    }
    .google-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-weight: 600;
    }
    .google-btn:disabled { opacity: .6; }
  </style>
</head>

<body>
  <main class="card-login">
    <h1 class="text-primary fw-bold text-center">🛡️ NewsIntel</h1>
    <p class="text-secondary text-center">
      Sign in to save and view your personal predictions.
    </p>

    <div id="loginError" class="alert alert-danger" hidden></div>
    <div id="loginStatus" class="alert alert-info" hidden></div>

    <button id="googleLogin" class="google-btn" type="button">
      Sign in with Google
    </button>

    <a href="/" class="btn btn-outline-primary w-100 mt-3">
      Continue without signing in
    </a>

    <p class="text-secondary small text-center mt-4 mb-0">
      You can use the prediction demo without an account.
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      'https://mpbtxrmzidbagwzwfwgo.supabase.co';

    // Replace this with your actual Supabase anon/publishable key.
    // Use the same key in index.html. Never put the Google Client Secret here.
    const SUPABASE_ANON_KEY =
      'sb_publishable_-SMQ-Rofi9LeohBFZ3c4iQ_-9o38G1B';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          flowType: 'pkce',
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loginButton = document.getElementById('googleLogin');
    const loginError = document.getElementById('loginError');
    const loginStatus = document.getElementById('loginStatus');

    function showError(message) {
      loginError.textContent = message;
      loginError.hidden = false;
      loginStatus.hidden = true;
    }

    async function checkSession() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {
          window.location.replace('/');
        }
      } catch (error) {
        console.error('Session check failed:', error);
        showError(error.message || 'Could not check login status.');
      }
    }

    async function handleGoogleLogin() {
      loginButton.disabled = true;
      loginButton.textContent = 'Connecting to Google...';
      loginError.hidden = true;
      loginStatus.hidden = false;
      loginStatus.textContent = 'Redirecting to Google sign-in...';

      try {
        const { error } =
          await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/'
            }
          });

        if (error) throw error;
      } catch (error) {
        console.error('Google sign-in failed:', error);
        showError(error.message || 'Google sign-in failed.');
        loginButton.disabled = false;
        loginButton.textContent = 'Sign in with Google';
      }
    }

    loginButton.addEventListener('click', handleGoogleLogin);

    checkSession();
  </script>
</body>
</html>
